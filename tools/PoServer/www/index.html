<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoServer — Tạo PO mẫu</title>
<style>
    :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-2: #273449;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --primary-dark: #0284c7;
        --ok: #22c55e;
        --err: #ef4444;
        --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, Geneva, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    .wrap { max-width: 1100px; margin: 0 auto; }

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }

    h1 { font-size: 22px; margin: 0; }
    h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }

    .badge {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        color: var(--muted);
    }
    .badge b { color: var(--primary); }

    .grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 20px;
        align-items: start;
    }

    @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
    }

    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
    }

    .card h2 {
        font-size: 15px;
        margin: 0 0 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
    }

    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

    input {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
    }
    input:focus { border-color: var(--primary); }
    input::placeholder { color: #64748b; }

    .field { margin-bottom: 16px; }

    .hint { font-size: 11px; color: #64748b; margin-top: 5px; }

    button {
        width: 100%;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        color: #082f49;
        background: var(--primary);
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    button:hover:not(:disabled) { background: #7dd3fc; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .msg {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
        word-break: break-word;
    }
    .msg.show { display: block; }
    .msg.ok { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.4); color: #86efac; }
    .msg.err { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #fca5a5; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    tbody tr:hover { background: var(--panel-2); }
    td.code { font-family: Consolas, monospace; }

    .tag {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        border: 1px solid var(--border);
        color: var(--muted);
    }
    .tag.ok { color: #86efac; border-color: rgba(34,197,94,.4); background: rgba(34,197,94,.1); }
    .tag.warn { color: #fcd34d; border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.1); }

    .empty { text-align: center; color: var(--muted); padding: 32px 0; font-size: 13px; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .toolbar button { width: auto; padding: 8px 14px; font-size: 12px; font-weight: 500; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .toolbar button:hover:not(:disabled) { background: #334155; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>
            PoServer — Công cụ tạo PO mẫu
            <small>Server giả lập quản lý Production Order cho SCADA TanTienQR</small>
        </h1>
        <div class="badge">API: <b>POST /api/po</b> · <b>GET /api/po</b></div>
    </header>

    <div class="grid">
        <!-- Form tạo PO -->
        <div class="card">
            <h2>Tạo PO mới</h2>

            <div class="field">
                <label for="orderNo">Mã lệnh sản xuất (Order No)</label>
                <input id="orderNo" type="text" placeholder="VD: PO20261109-001" autocomplete="off">
                <div class="hint">Bấm "Gợi ý" để điền nhanh mã theo ngày.</div>
                <button type="button" id="suggestBtn"
                        style="margin-top:8px;width:auto;padding:6px 12px;font-size:12px;font-weight:500;background:var(--panel-2);color:var(--text);border:1px solid var(--border);">
                    Gợi ý mã PO
                </button>
            </div>

            <div class="field">
                <label for="orderQty">Số lượng mã</label>
                <input id="orderQty" type="number" value="100" min="1" max="100000" step="1">
                <div class="hint">Mỗi mã được sinh theo chuẩn TXNG Digital Link: /01/{gtin}/21/{serial}</div>
            </div>

            <button id="createBtn">Tạo PO</button>

            <div id="msg" class="msg"></div>
        </div>

        <!-- Danh sách PO -->
        <div class="card">
            <h2>Danh sách PO</h2>

            <div class="toolbar">
                <button id="refreshBtn">Làm mới</button>
            </div>

            <div id="tableWrap">
                <div class="empty">Đang tải...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const orderNoInput = document.getElementById('orderNo');
    const orderQtyInput = document.getElementById('orderQty');
    const createBtn = document.getElementById('createBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const suggestBtn = document.getElementById('suggestBtn');
    const msg = document.getElementById('msg');
    const tableWrap = document.getElementById('tableWrap');

    function showMessage(text, isError) {
        msg.textContent = text;
        msg.className = 'msg show ' + (isError ? 'err' : 'ok');
    }

    function clearMessage() {
        msg.className = 'msg';
    }

    function fmtDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d)) return iso;
        return d.toLocaleString('vi-VN');
    }

    async function loadOrders() {
        try {
            const res = await fetch('/api/po');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const orders = await res.json();

            if (!orders.length) {
                tableWrap.innerHTML = '<div class="empty">Chưa có PO nào. Hãy tạo PO đầu tiên.</div>';
                return;
            }

            let html = '<table><thead><tr>' +
                '<th>Mã PO</th><th>Số lượng mã</th><th>Ngày tạo</th><th>Trạng thái</th>' +
                '</tr></thead><tbody>';

            for (const o of orders) {
                html += '<tr>' +
                    '<td class="code">' + escapeHtml(o.orderNo) + '</td>' +
                    '<td>' + o.orderQty + '</td>' +
                    '<td>' + fmtDate(o.createdUtc) + '</td>' +
                    '<td><span class="tag">Chưa bắt đầu</span></td>' +
                    '</tr>';
            }

            html += '</tbody></table>';
            tableWrap.innerHTML = html;
        } catch (e) {
            tableWrap.innerHTML = '<div class="empty">Không tải được danh sách PO: ' + escapeHtml(e.message) + '</div>';
        }
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    suggestBtn.addEventListener('click', () => {
        const d = new Date();
        const ymd = d.getFullYear() +
            String(d.getMonth() + 1).padStart(2, '0') +
            String(d.getDate()).padStart(2, '0');
        orderNoInput.value = 'PO' + ymd + '-001';
    });

    createBtn.addEventListener('click', async () => {
        clearMessage();

        const orderNo = orderNoInput.value.trim();
        const orderQty = parseInt(orderQtyInput.value, 10);

        if (!orderNo) {
            showMessage('Vui lòng nhập Mã PO.', true);
            orderNoInput.focus();
            return;
        }
        if (!Number.isFinite(orderQty) || orderQty <= 0) {
            showMessage('Số lượng mã phải là số nguyên lớn hơn 0.', true);
            orderQtyInput.focus();
            return;
        }

        createBtn.disabled = true;
        createBtn.textContent = 'Đang tạo...';

        try {
            const res = await fetch('/api/po', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderNo: orderNo, orderQty: orderQty })
            });

            const data = await res.json().catch(() => null);

            if (!res.ok) {
                showMessage(data && data.message ? data.message : ('HTTP ' + res.status), true);
                return;
            }

            showMessage('Đã tạo PO ' + data.orderNo + ' với ' + data.orderQty + ' mã.', false);
            orderQtyInput.value = 100;
            await loadOrders();
        } catch (e) {
            showMessage('Lỗi khi tạo PO: ' + e.message, true);
        } finally {
            createBtn.disabled = false;
            createBtn.textContent = 'Tạo PO';
        }
    });

    refreshBtn.addEventListener('click', loadOrders);

    orderNoInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') createBtn.click();
    });

    loadOrders();
</script>
</body>
</html>
